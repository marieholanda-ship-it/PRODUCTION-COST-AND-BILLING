<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCMD · Production Cost &amp; Attendance · Vienovo</title>
<meta name="theme-color" content="#00516b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#f2f6f9; --panel:#ffffff; --soft:#eef4f7; --ink:#0e2431; --mut:#6b8290; --line:#e4ecf1;
  --brand:#00405f; --brand2:#00a0c0; --acc:#80c020; --acc2:#6a9e18;
  --ok:#1f9d55; --warn:#d98a00; --bad:#e5484d; --info:#3b82f6;
  --c1:#00607f; --c2:#00a0c0; --c3:#80c020; --c4:#7c6cf0; --c5:#f5a524;
  --r:16px; --shadow:0 1px 2px rgba(16,40,54,.04),0 10px 28px rgba(16,40,54,.06);
}
html[data-theme="dark"]{
  --bg:#08161e; --panel:#0f2530; --soft:#122c38; --ink:#e6f0f5; --mut:#8ba6b3; --line:#1d3a49;
  --brand:#4bb3dd; --brand2:#33b2d4; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--acc);color:#0d2b06}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3d3dc;border-radius:8px;border:2px solid transparent;background-clip:content-box}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#21404f;background-clip:content-box}

/* ============ shell ============ */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center;flex:none}
.brand .logo{width:42px;height:42px;object-fit:contain;border-radius:11px;background:#fff;border:1px solid var(--line);padding:3px;flex:none}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.brand small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.02em}
.topnav{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);padding:4px;border-radius:13px;margin-left:auto;overflow-x:auto;max-width:100%}
.topnav button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--mut);font:700 13.5px inherit;padding:8px 18px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
.topnav button:hover{color:var(--ink)}
.topnav button.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 35%,transparent)}
.tb-actions{display:flex;align-items:center;gap:8px;margin-left:10px}
.user{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.user .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--acc));color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.user span{font-size:12.5px;font-weight:700}
.view{padding:20px;max-width:1460px;width:100%;margin:0 auto}
.pagehead{margin-bottom:14px}
.pagehead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.pagehead p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.subtabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow);position:sticky;top:74px;z-index:25}
.busy{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--brand2) 26%,transparent));border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);font-weight:800;color:var(--ink)}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:3px solid color-mix(in srgb,var(--brand) 25%,transparent);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.subtabs button{border:0;background:none;color:var(--mut);font:700 13px inherit;padding:8px 22px;border-radius:9px;cursor:pointer;transition:.15s}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{background:var(--brand2);color:#fff}
.hide-desk{display:inline}

/* ============ primitives ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.card .sub{color:var(--mut);font-size:12px;margin:3px 0 12px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--brand);color:#fff;font:700 13px inherit;padding:9px 15px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.g{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--brand2);color:var(--brand)}
.btn.a{background:var(--acc);color:#173d05}
.btn.d{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.s{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.block{width:100%;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:11.5px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-w{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p-b{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.p-n{background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent);padding:4px 11px;border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.fgroup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:600 13px inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%;outline:none;transition:.15s}
select:focus,input:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 18%,transparent)}
label.f{display:block;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}
.field{margin-bottom:12px}
.empty{text-align:center;padding:46px 12px;color:var(--mut)}
.empty .big{font-size:30px;margin-bottom:6px;opacity:.6}
.mu{color:var(--mut)}
.up{color:var(--bad)}
.dn{color:var(--ok)}

/* KPI */
.kpi .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi .kic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--ac,var(--brand));box-shadow:0 6px 14px color-mix(in srgb,var(--ac,var(--brand)) 35%,transparent)}
.kpi .l{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:27px;font-weight:800;margin:6px 0 3px;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;font-weight:600;color:var(--mut)}
.kpi .d .pill{padding:2px 8px;font-size:11px}

/* tables */
.sc{overflow-x:auto;border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:800;position:sticky;top:0;background:var(--panel)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--soft)}
table.t tr.tot td{background:var(--soft);font-weight:800}
.r{text-align:right}

/* bars / badges */
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
.hb .lb{width:120px;flex:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;background:var(--soft);border-radius:8px;height:12px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:8px}
.hb .vl{width:86px;text-align:right;flex:none;font-weight:700}
svg.ch{width:100%;height:auto;display:block}
svg.dn{width:180px;height:180px;display:block;margin:auto}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font-size:10px;font-weight:600}
.dv{fill:var(--ink);font-weight:800;font-size:15px}

/* heatmap */
.heat td{padding:3px;border:0;text-align:center}
.heat td>div{border-radius:7px;padding:7px 2px;font-size:10.5px;font-weight:800;min-width:40px}
.heat th{text-align:center;padding:2px;font-size:10px;color:var(--mut)}
table.t.heat td{font-size:10px;padding:3px 4px}
table.t.heat th{font-size:9.5px;padding:3px 4px;white-space:nowrap}
table.costT{white-space:nowrap}
table.costT th,table.costT td{padding:5px 7px;font-size:11.5px}

/* report / paper */
.paper{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:880px;margin:0 auto;box-shadow:var(--shadow)}
.paper .hd{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:16px}
.paper .hd b{font-size:18px;letter-spacing:.04em}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-size:12.5px;margin-bottom:14px}
.infogrid .mu{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:20px;font-size:11.5px}
.sig>div{border-top:1.5px solid var(--mut);padding-top:6px}
.sig b{display:block;font-size:12px}
.iss{font-size:12px;margin:4px 0;display:flex;gap:6px;align-items:flex-start}
.iss.b{color:var(--bad)} .iss.w{color:var(--warn)}

/* tracker */
.tk{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:7px;font-size:11px;font-weight:800;margin:1px;cursor:pointer;border:1px solid transparent;transition:.15s}
.tk:hover{transform:translateY(-1px)}
.wgwrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.wg{display:inline-flex;align-items:center;gap:5px;min-width:46px;justify-content:center;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:800;margin:1px;cursor:pointer;border:1px solid transparent;transition:.15s}
.wg .s{opacity:.6;font-weight:700}
.wg:hover{transform:translateY(-1px)}
.wg.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.wg.un{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent)}
.wg.empty{border-style:dashed;border-color:var(--line);color:var(--mut);opacity:.7}
.wg.empty:hover{opacity:1;border-color:var(--brand2);color:var(--brand)}
.wgtot{font-size:11.5px;font-weight:800;color:var(--brand);margin-top:1px;letter-spacing:.02em}

/* employee grid */
.eg{border-collapse:separate;border-spacing:0;font-size:12px}
.eg td,.eg th{padding:1px;border:0;text-align:center}
.eg th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:10px;color:var(--mut);font-weight:800}
.eg .n{position:sticky;left:0;background:var(--panel);text-align:left;padding:4px 12px 4px 2px;white-space:nowrap;z-index:1;min-width:170px}
.eg th.n{z-index:3}
.eg .sn{border-left:2px solid var(--line)}
.ec{height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;margin:1px auto}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,25,34,.55);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:900px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:18px 18px 0 0;z-index:2}
.modal .mh h3{margin:0;font-size:15px}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel);border-radius:0 0 18px 18px}
.rv input,.rv select{width:100%;min-width:74px}
.rv td input[type=number]{width:74px}
.x{background:none;border:1px solid var(--line);border-radius:9px;color:var(--ink);cursor:pointer;padding:6px;display:grid;place-items:center}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* responsive */
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:980px){
  .topbar{background:var(--panel);gap:10px}
  .topnav{order:3;width:100%;margin:6px 0 0;justify-content:space-between}
  .topnav button{flex:1;justify-content:center;padding:9px 8px}
}
@media(max-width:720px){
  .view{padding:14px}
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .user span{display:none}
  .hide-desk{display:none}
  .topbar{padding:10px 14px}
}
@media print{
  body *{visibility:hidden!important}
  #rpt,#rpt *{visibility:visible!important}
  #rpt{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;border-radius:0;padding:0}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" id="logo" alt="Company logo">
      <div><b>PCMD</b><small>Production Cost &amp; Attendance</small></div>
    </div>
    <nav class="topnav" id="topnav"></nav>
    <div class="tb-actions">
      <button class="x" data-act="theme" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
      <button class="x" data-act="settings" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* =======================================================================
   PCMD · Production Cost & Attendance
   Vienovo Philippines, Inc.  |  Agency: PRIJ Manpower Services
   Single-file web app · no install · data stored in localStorage
   ======================================================================= */

/* ---------- constants ---------- */
const KEY='pcmd.v1';
const DEFAULT_PLANTS=['AC - Bulacan','PFMIS','HOREB','ARGAO','BUKID','SOUTH','CCPC'];
const DEFAULT_ATT_PLANTS=['AC - Bulacan','PFMIS','HOREB','ARGAO','BUKID'];
const DEFAULT_SHIFTS=['First','Second'];
const DEFAULT_CATS=['Electricity','Water','Fuel','Manpower Agency','Others'];
const DEFAULT_POSITIONS=['Coordinator','Team Leader','Plant Utility','Mix Grain','FG Bagging','Repacking','Micro Weigher','Macro Weigher','Pouring','Tool Keeper / Maintenance Assist'];
const DEFAULT_REQ={'Coordinator':1,'Team Leader':1,'Plant Utility':1,'Mix Grain':3,'FG Bagging':1,'Repacking':1,'Micro Weigher':1,'Macro Weigher':3,'Pouring':2,'Tool Keeper / Maintenance Assist':2};
const DEFAULT_AGENCIES=['PRIJ Manpower Services','Asia Peopleworks, Inc.'];
const SIGS=[['prep','Prepared by (Agency Coordinator)'],['check','Checked by (Agency Admin Staff)'],['att','Attested by (Vienovo Warehouse Coordinator)'],['con','Concurred by (Vienovo Warehouse Team Leader)']];
const CATCOLOR={'Electricity':'var(--c1)','Water':'var(--c2)','Fuel':'var(--c3)','Manpower Agency':'var(--c4)','Others':'var(--c5)'};
const MN='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const BUILD='build 2026-10-01 · v26';
/* ---------- production cost model ---------- */
const COST_COLS=[['vol','Volume, kg'],['rental','Rental / Amor'],['spare','Spare Parts'],['mpd','Manpower Direct'],['diesel','Diesel'],['elec','Electricity Machine'],['agency','Manpower Agency'],['other','Other'],['third','3rd Party Service',1],['cess','CESS Depreciation',1],['spdep','SP Depreciation',1],['ins','Insurance Personnel',1],['water','Water',1],['thread','Thread',1],['toll','Tolling Fee']];
const COST_KEYS=COST_COLS.map(c=>c[0]);
const COST_ADD=['rental','spare','mpd','diesel','elec','agency','other','toll'];
const COST_PL=['AC','PFMIS','HOREB','BUKID','ARGAO','CCPC','SOUTH'];
const COST_PC={AC:'#00A6CE',PFMIS:'#95C93D',HOREB:'#00405E',BUKID:'#e08a1e',ARGAO:'#8e5ea2',CCPC:'#c0527a',SOUTH:'#7f8c8d'};
const COST_BUILD=[['rental','Rental / Amor','#00405E'],['spare','Spare Parts','#00A6CE'],['mpd','Mfg Direct','#95C93D'],['diesel','Diesel','#e08a1e'],['elec','Electricity','#8e5ea2'],['agency','Agency','#c0527a'],['other','Other','#7f8c8d'],['toll','Tolling','#d4b21c']];
const COST_MAIN=COST_COLS.filter(c=>['vol','rental','spare','mpd','diesel','elec','agency','toll'].indexOf(c[0])>=0);
const COST_DETAILS=COST_COLS.filter(c=>['other','third','cess','spdep','ins','water','thread'].indexOf(c[0])>=0);

/* ---------- filters / selectors ---------- */
const fBills=()=>S.bills.filter(b=>(filters.plant==='all'||b.plant===filters.plant)&&(filters.month==='all'||b.per===filters.month));
const fSheets=()=>S.sheets.filter(s=>(filters.plant==='all'||s.plant===filters.plant)&&(filters.month==='all'||s.date.slice(0,7)===filters.month)&&(filters.shift==='all'||s.shift===filters.shift));
const monthsList=()=>[...new Set([...S.bills.map(b=>b.per),...S.sheets.map(s=>s.date.slice(0,7))])].filter(Boolean).sort();

function filterSelects(withShift){
  const pl=(withShift?S.settings.attPlants:S.settings.plants).slice();
  if(filters.plant!=='all'&&pl.indexOf(filters.plant)<0)pl.unshift(filters.plant);
  return '<select data-filter="plant"><option value="all">All plants</option>'+pl.map(p=>'<option '+(p===filters.plant?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select>'
    +'<select data-filter="month"><option value="all">All months</option>'+monthsList().map(m=>'<option value="'+m+'" '+(m===filters.month?'selected':'')+'>'+ml(m)+'</option>').join('')+'</select>'
    +(withShift?'<select data-filter="shift"><option value="all">All shifts</option>'+S.settings.shifts.map(x=>'<option '+(x===filters.shift?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':'');
}
function filterBar(withShift,extra){
  return '<div class="toolbar"><div class="fgroup">'+filterSelects(withShift)+'</div><div class="fgroup">'+(extra||'')+'</div></div>';
}

/* ---------- validation ---------- */
function validate(s){
  const iss=[],P=S.settings.positions;
  const rq=sum(P,p=>s.rows&&s.rows[p]?s.rows[p][0]:0),ac=sum(P,p=>s.rows&&s.rows[p]?s.rows[p][1]:0);
  if(!s.plant||!/^\d{4}-\d\d-\d\d$/.test(s.date||''))iss.push(['b','Plant or date missing']);
  if(s.decl!=null&&s.decl!==''&&+s.decl!==ac)iss.push(['b','Declared total '+s.decl+' does not equal sum of positions '+ac]);
  SIGS.forEach(([k,l])=>{if(!s.sig||!s.sig[k])iss.push(['b','Unsigned: '+l])});
  if(S.sheets.some(x=>x.id!==s.id&&x.plant===s.plant&&x.date===s.date&&x.shift===s.shift&&x.agency===s.agency))iss.push(['b','Duplicate: same plant, date, shift and agency already recorded']);
  if(s.ros&&s.ros.length){const np=s.ros.filter(x=>x.a===1).length;if(np!==ac)iss.push(['w','Roster shows '+np+' present but actual total is '+ac])}
  P.forEach(p=>{const r=s.rows&&s.rows[p];if(!r)return;if(r[1]<r[0])iss.push(['w',p+': short by '+(r[0]-r[1])]);else if(r[1]>r[0])iss.push(['w',p+': over by '+(r[1]-r[0])])});
  const st=SIGS.every(([k])=>s.sig&&s.sig[k])?'ok':'un';
  return {iss,rq,ac,st};
}
const badge=st=>'<span class="pill '+(st==='ok'?'p-ok':'p-b')+'">'+(st==='ok'?'Signed':'Unsigned')+'</span>';
const fillPill=r=>'<span class="pill '+(r>=95?'p-ok':r>=90?'p-w':'p-b')+'">'+(r||0).toFixed(1)+'%</span>';
const fillColor=r=>r>=98?'var(--ok)':r>=95?'var(--acc)':r>=90?'var(--warn)':'var(--bad)';

/* ---------- charts ---------- */
function stackBars(ms,d){
  const W=660,H=260,pad=44,mx=Math.max(1,...ms.map(m=>sum(S.settings.cats,c=>d[m][c]))),bw=Math.min(58,(W-pad)/ms.length*.6);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="ch">';
  for(let i=0;i<=4;i++){const y=12+(H-44)*(1-i/4);s+='<line x1="'+pad+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(pad-6)+'" y="'+(y+3)+'" class="ax" text-anchor="end">'+shortv(mx*i/4)+'</text>'}
  ms.forEach((m,i)=>{const x=pad+(W-pad)/ms.length*(i+.5)-bw/2;let y=H-32;
    S.settings.cats.forEach(c=>{const v=d[m][c]||0,h=v/mx*(H-44);if(h>0){y-=h;s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" style="fill:'+CATCOLOR[c]+'"><title>'+ml(m)+' '+c+': '+peso(v)+'</title></rect>'}});
    s+='<text x="'+(x+bw/2)+'" y="'+(H-14)+'" class="ax" text-anchor="middle">'+MN[+m.slice(5)-1]+'</text>';});
  return s+'</svg>';
}
function donut(items,tot){
  let a=-Math.PI/2,s='<svg viewBox="0 0 120 120" class="dn">';
  items.forEach(([c,v])=>{if(!v||!tot)return;const f=v/tot*2*Math.PI,r=46,x1=60+r*Math.cos(a),y1=60+r*Math.sin(a);a+=f;const x2=60+r*Math.cos(a-.0001),y2=60+r*Math.sin(a-.0001);
    s+='<path d="M'+x1+' '+y1+'A'+r+' '+r+' 0 '+(f>Math.PI?1:0)+' 1 '+x2+' '+y2+'" fill="none" stroke-width="16" style="stroke:'+CATCOLOR[c]+'"><title>'+c+': '+peso(v)+'</title></path>'});
  return s+'<text x="60" y="58" text-anchor="middle" class="dv">₱'+shortv(tot)+'</text><text x="60" y="72" text-anchor="middle" class="ax">total</text></svg>';
}
function areaLine(pts,target){
  const W=660,H=230,pad=40,v=pts.map(x=>x[1]);
  let lo=Math.min.apply(null,v.concat([target||95,90]))-3,hi=Math.max.apply(null,v.concat([target||95,100]));
  if(hi-lo<6){hi=lo+6}
  const X=i=>pad+(W-pad-8)*(pts.length<2?.5:i/(pts.length-1)),Y=y=>12+(H-44)*(1-(y-lo)/(hi-lo));
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="ch">';
  for(let i=0;i<=4;i++){const g=lo+(hi-lo)*i/4;s+='<line x1="'+pad+'" x2="'+W+'" y1="'+Y(g)+'" y2="'+Y(g)+'" class="gl"/><text x="'+(pad-6)+'" y="'+(Y(g)+3)+'" class="ax" text-anchor="end">'+Math.round(g)+'%</text>'}
  if(target){s+='<line x1="'+pad+'" x2="'+W+'" y1="'+Y(target)+'" y2="'+Y(target)+'" stroke-dasharray="5 4" style="stroke:var(--acc)"/><text x="'+W+'" y="'+(Y(target)-5)+'" class="ax" text-anchor="end">'+target+'% target</text>'}
  const dd=pts.map((q,i)=>(i?'L':'M')+X(i)+' '+Y(q[1])).join('');
  s+='<path d="'+dd+'L'+X(pts.length-1)+' '+(H-32)+'L'+X(0)+' '+(H-32)+'Z" style="fill:var(--brand);opacity:.10"/>';
  s+='<path d="'+dd+'" fill="none" stroke-width="2.6" style="stroke:var(--brand)"/>';
  const step=Math.ceil(pts.length/8);
  pts.forEach((q,i)=>{s+='<circle cx="'+X(i)+'" cy="'+Y(q[1])+'" r="3.6" style="fill:'+(target&&q[1]<target?'var(--bad)':'var(--brand)')+'"><title>'+q[0]+': '+q[1].toFixed(1)+'%</title></circle>';if(i%step===0)s+='<text x="'+X(i)+'" y="'+(H-14)+'" class="ax" text-anchor="middle">'+q[0].slice(5)+'</text>'});
  return s+'</svg>';
}
const hbar=(l,v,mx,t,c)=>'<div class="hb"><span class="lb" title="'+esc(l)+'">'+esc(l)+'</span><div class="tr"><i style="width:'+Math.min(100,v/(mx||1)*100)+'%;background:'+(c||'linear-gradient(90deg,var(--brand),var(--c2))')+'"></i></div><span class="vl">'+t+'</span></div>';

}

/* ---------- pages: overview ---------- */
function pageOverview(){
  const B=fBills(),A=fSheets();
  if(!B.length&&!A.length)return emptyBox();
  const ms=monthsList();
  const tot=sum(B,b=>b.amt);
  const tm={};ms.forEach(m=>tm[m]=sum(B.filter(b=>b.per===m),b=>b.amt));
  const last=ms.at(-1),prev=ms.at(-2),ch=prev&&tm[prev]?(tm[last]-tm[prev])/tm[prev]*100:null;
  const V=A.map(a=>({a,v:validate(a)}));
  const rq=sum(V,x=>x.v.rq),ac=sum(V,x=>x.v.ac),fill=pct(ac,rq);
  const short_=sum(A,a=>sum(S.settings.positions,p=>Math.max(0,(a.rows[p]||[0,0])[0]-(a.rows[p]||[0,0])[1])));
  const failV=V.filter(x=>x.v.st==='un');
  const bd={};V.forEach(x=>{const k=x.a.date;(bd[k]=bd[k]||[0,0]);bd[k][0]+=x.v.ac;bd[k][1]+=x.v.rq});
  const dates=Object.keys(bd).sort(),pts=dates.map(k=>[k,pct(bd[k][0],bd[k][1])]);
  const d={};ms.forEach(m=>{d[m]={};S.settings.cats.forEach(c=>d[m][c]=sum(B.filter(b=>b.per===m&&b.cat===c),b=>b.amt))});
  const bc=S.settings.cats.map(c=>[c,sum(B.filter(b=>b.cat===c),b=>b.amt)]);
  const recent=[...B].sort((a,b)=>b.per.localeCompare(a.per)).slice(0,6);
  const uns=V.filter(x=>x.v.st==='un').sort((a,b)=>b.a.date.localeCompare(a.a.date)).slice(0,6);
  return filterBar(false)
   +'<div class="grid g4">'
   +kpi('Total spend',peso(tot),B.length+' bills over '+ms.length+' months','wallet','var(--c1)')
   +kpi('Manning fill rate',fill.toFixed(1)+'%',fillPill(fill)+' <span class="mu">'+ac+' of '+rq+' required</span>','users','var(--c3)')
   +kpi('Unsigned sheets',failV.length,failV.length?'missing at least one signature':'all sheets fully signed','alert','var(--c5)')
   +kpi('Headcount shortage',short_,'across '+A.length+' shift sheets','clock','var(--c4)')
   +'</div>'
   +'<div class="grid g21"><div class="card"><h3>Monthly cost trend</h3><div class="sub">Stacked by category</div>'+stackBars(ms,d)+'<div class="lg" style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)">'+S.settings.cats.map(c=>'<span><b style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:'+CATCOLOR[c]+'"></b>'+c+'</span>').join('')+'</div></div>'
   +'<div class="card"><h3>Cost mix</h3><div class="sub">Share by category</div>'+donut(bc,tot)+'<div style="text-align:center;font-size:11.5px;color:var(--mut);margin-top:8px">'+bc.map(([c,v])=>esc(c)+' '+Math.round(pct(v,tot))+'%').join(' · ')+'</div></div></div>'
   +'<div class="grid g2"><div class="card"><h3>Daily manning fill rate</h3><div class="sub">All plants in view · red dots below the 95% target</div>'+(pts.length?areaLine(pts,95):'<div class="empty">No attendance data.</div>')+'</div>'
   +'<div class="card"><h3>Plant scorecard</h3><div class="sub">Required vs actual manning</div>'+plantScorecard(V)+'</div></div>'
   +'<div class="grid g2"><div class="card"><h3>Recent bills</h3><div class="sub">Latest by billing period</div><div class="sc"><table class="t"><thead><tr><th>Category</th><th>Plant</th><th>Period</th><th class="r">Amount</th></tr></thead><tbody>'+recent.map(r=>'<tr><td><span class="pill p-n" style="color:'+CATCOLOR[r.cat]+'">'+esc(r.cat)+'</span></td><td>'+esc(r.plant)+'</td><td>'+ml(r.per)+'</td><td class="r"><b>'+peso(r.amt)+'</b></td></tr>').join('')+'</tbody></table></div></div>'
   +'<div class="card"><h3>Needs attention</h3><div class="sub">Unsigned or short-staffed shifts</div>'+(uns.length?uns.map(x=>'<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.a.plant)+'</b> · '+x.a.date.slice(5)+' · '+esc(x.a.shift)+' <span class="mu">'+esc(x.a.agency)+'</span><div class="iss '+(x.v.st==='un'?'b':'w')+'" style="margin-top:3px">'+x.v.iss.slice(0,2).map(i=>esc(i[1])).join(' · ')+'</div></div>').join(''):'<div class="mu" style="padding:10px 0">All shift sheets are signed and full.</div>')+'</div></div>';
}

/* ---------- Cost dashboard (production cost) ---------- */
function costF2(n){return n===''||n==null||isNaN(n)?'':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function costParsePeriod(p){const m=/(\d{4})\s+([A-Za-z]{3})/.exec(p||'');return m?+m[1]*100+MN.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].toLowerCase()):null}
function costCpk(r){return r.vol?r.total/r.vol:0}
function costBar(items,fmt){const W=520,rh=30,H=items.length*rh+10,m=Math.max.apply(null,items.map(i=>i.v).concat([1]));
 return '<svg viewBox="0 0 '+W+' '+H+'" class="ch" style="max-height:260px">'+items.map((it,i)=>{const w=(W-190)*it.v/m;return '<text x="0" y="'+(i*rh+19)+'" class="ax">'+esc(it.n)+'</text><rect x="110" y="'+(i*rh+5)+'" width="'+Math.max(w,1)+'" height="20" rx="3" fill="'+(it.c||'#00A6CE')+'"/><text x="'+(116+w)+'" y="'+(i*rh+19)+'" style="fill:var(--ink);font-weight:700">'+fmt(it.v)+'</text>'}).join('')+'</svg>'}
function costLine(pts){if(!pts.length)return '<p class="mu">No data for this plant yet.</p>';const W=520,H=230,L=46,B=30,mx=Math.max.apply(null,pts.map(p=>p.v).concat([1]))*1.15;
 const x=i=>L+(pts.length==1?(W-L-20)/2:i*(W-L-30)/(pts.length-1)),y=v=>H-B-v/mx*(H-B-15);let g='';
 for(let i=0;i<=4;i++){const v=mx*i/4;g+='<line x1="'+L+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" class="gl"/><text x="0" y="'+(y(v)+4)+'" class="ax">'+v.toFixed(2)+'</text>'}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="ch" style="max-height:230px">'+g+'<polyline fill="none" stroke="var(--brand2)" stroke-width="3" points="'+pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')+'"/>'+pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="5" fill="var(--brand)" stroke="var(--acc)" stroke-width="2"/><text x="'+(x(i)-14)+'" y="'+(y(p.v)-10)+'" style="fill:var(--ink);font-weight:700">'+p.v.toFixed(2)+'</text><text x="'+(x(i)-22)+'" y="'+(H-8)+'" class="ax">'+esc(p.n)+'</text>').join('')+'</svg>'}
function costMulti(series,pers,fmt){if(!pers.length)return '<p class="mu">No monthly data yet.</p>';const W=640,H=230,L=62,B=34,all=[];series.forEach(s=>s.v.forEach(v=>{if(v!=null)all.push(v)}));const mx=Math.max.apply(null,all.concat([1]))*1.12;
 const x=i=>L+(pers.length==1?(W-L-30)/2:i*(W-L-40)/(pers.length-1)),y=v=>H-B-v/mx*(H-B-15);let g='';

const empKey=n=>String(n||'').toLowerCase().replace(/[^a-z0-9\s]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean).sort().join(' ');
function findEmp(name){const k=empKey(name);return (S.employees||[]).find(e=>empKey(e.name)===k)}
function upsertEmployees(ros,date,agency){
  if(!S.employees)S.employees=[];
  const out=[];
  (ros||[]).forEach(r=>{if(!r.n||!String(r.n).trim())return;const k=empKey(r.n);let e=S.employees.find(x=>empKey(x.name)===k);
    if(!e){e={id:uid(),name:String(r.n).trim(),position:r.p||'',agency:agency||'',status:'active',from:date||today(),to:'',note:''};S.employees.push(e)}
    else{e.name=String(r.n).trim();if(r.p)e.position=r.p;if(agency&&!e.agency)e.agency=agency}
    out.push(e);
  });
  return out;
}
function empStats(e,plant,period){
  const k=empKey(e.name);let P=0,A=0,L=0;const days=new Set();
  S.sheets.forEach(s=>{if(plant&&plant!=='all'&&s.plant!==plant)return;if(period&&period!=='all'&&s.date.slice(0,7)!==period)return;
    (s.ros||[]).forEach(r=>{if(empKey(r.n)!==k)return;if(r.a===1)P++;else if(r.a===0)A++;else L++;days.add(s.date)})});
  return{P:P,A:A,L:L,days:days.size,rate:(P+A)?P/(P+A)*100:100};
}

    let tot=0;

      const s=S.sheets.find(x=>x.plant===pl&&x.date===d&&x.shift===sh);
      const ok=s&&validate(s).st==='ok';
      const hc=hcOf(s);tot+=hc;

const mapPos=n=>{const s=String(n||'').toLowerCase().trim();if(!s)return null;return S.settings.positions.find(p=>p.toLowerCase()===s)||S.settings.positions.find(p=>s.indexOf(p.toLowerCase().split(/[ /]/)[0])>=0)||null};

function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function compressImage(dataUrl,max,q){return new Promise(res=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>res('');img.src=dataUrl})}
function parseAIJSON(t){t=String(t||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);return JSON.parse(t)}
const AI_MODELS=['gemini-2.0-flash','gemini-2.5-flash','gemini-1.5-flash','gemini-flash-latest'];
async function geminiCall(model,key,body){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();const e=new Error('HTTP '+r.status+' '+t.slice(0,180));e.status=r.status;throw e}
  return r.json();
}
const aiText=j=>((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
const aiRetriable=e=>{const s=e&&e.status;const m=String(e&&e.message);return s===404||s===429||s===500||s===503||/not found|not supported|does not exist|no longer|high demand|overload|try again|rate limit|quota|unavailable|temporarily/i.test(m)};
async function listModels(key){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));
  if(!r.ok){const t=await r.text();const e=new Error('HTTP '+r.status+' '+t.slice(0,160));e.status=r.status;throw e}

}
function pickModel(list){
  const flash=(list||[]).filter(m=>/flash/i.test(m)&&!/embedding|image|tts|audio|vision/i.test(m));

async function geminiJSON(parts,prompt){
  const ai=S.settings.ai||{};if(!ai.key)throw new Error('No API key set');
  const body={contents:[{role:'user',parts:[{text:prompt}].concat(parts)}],generationConfig:{temperature:0,responseMimeType:'application/json'}};
  let discovered=[];
  try{discovered=[pickModel(await listModels(ai.key))].filter(Boolean)}catch(e){}
  const configured=ai.model||'gemini-2.0-flash';
  const tries=[configured].concat(discovered,AI_MODELS).filter((v,i,a)=>v&&a.indexOf(v)===i);
  let lastErr;
  for(const m of tries){
    for(let attempt=0;attempt<2;attempt++){
      try{const j=await geminiCall(m,ai.key,body);S.settings.ai.model=m;save();lastAIRaw=aiText(j);return parseAIJSON(lastAIRaw)}
      catch(e){lastErr=e;if(!aiRetriable(e))throw e;if(attempt===0)await new Promise(r=>setTimeout(r,1500))}
    }
  }
  throw lastErr;
}

function jsonp(url,param){return new Promise((resolve,reject)=>{const name='pcmdCB'+Math.random().toString(36).slice(2);const s=document.createElement('script');let done=false;window[name]=d=>{done=true;try{resolve(d)}finally{delete window[name];if(s.parentNode)s.remove()}};s.onerror=()=>{done=true;delete window[name];if(s.parentNode)s.remove();reject(new Error('load failed'))};s.src=url+(url.indexOf('?')<0?'?':'&')+param+'='+name;document.body.appendChild(s);setTimeout(()=>{if(!done){delete window[name];if(s.parentNode)s.remove();reject(new Error('timeout'))}},20000)})}
async function sheetRead(){

  catch(e){try{const r=await fetch(c.url+'?token='+encodeURIComponent(c.token));return await r.json()}catch(e2){throw new Error('unreachable')}}
}

function sheetFromAI(j,thumb){
  const d=blankSheet();
  d.plant=guessPlant(j.plant)||S.settings.attPlants[0];
  d.date=(j.date&&/^\d{4}-\d\d-\d\d$/.test(j.date))?j.date:today();
  const yy=+d.date.slice(0,4),cy=+today().slice(0,4);if(yy<cy-1||yy>cy+1)d.date=cy+d.date.slice(4);
  d.shift=S.settings.shifts.includes(j.shift)?j.shift:S.settings.shifts[0];
  d.agency=j.agency||S.settings.agencies[0];
  S.settings.positions.forEach(p=>{d.rows[p]=[S.settings.req[p]||0,0]});
  const rowsList=j.rows||j.positions||[];
  rowsList.forEach(r=>{const p=mapPos(r.position||r.pos||r.p);if(p)d.rows[p]=[+(r.required!=null?r.required:r.req)||0,+(r.actual!=null?r.actual:r.act)||0]});
  const rosterList=j.roster||j.names||j.employees||[];
  d.ros=rosterList.filter(r=>r&&(r.name||r.n)).map(r=>({n:String(r.name||r.n).trim(),p:mapPos(r.position||r.pos||r.p)||S.settings.positions[0],a:1,ti:(r.time_in||r.ti||''),to:(r.time_out||r.to||'')}));
  const seen={};d.ros=d.ros.filter(r=>{const k=empKey(r.n);if(seen[k])return false;seen[k]=1;return true});
  S.settings.positions.forEach(p=>{const c=d.ros.filter(r=>r.p===p).length;if(c)d.rows[p][1]=c});
  d.decl=(j.declared_total==null?null:+j.declared_total);
  const g=j.signatures||{};d.sig={prep:+!!g.prepared,check:+!!g.checked,att:+!!g.attested,con:+!!g.concurred};
  d.aiNote=(j.notes||j.note||'').toString().slice(0,400);
  d.thumb=thumb||'';
  return d;
}
async function handleAttUpload(files){
  files=[...files].filter(f=>f.type.indexOf('image/')===0||f.type==='application/pdf').slice(0,5);
  if(!files.length)return;
  upErr='';lastAIRaw='';lastAIErr='';const ai=S.settings.ai||{};
  if(!ai.key){upErr='Auto-read needs a Google Gemini API key — add it in Settings.';startSheet(null,blankSheet());return}
  upBusy='Scanning with AI… reading '+files.length+' sheet(s), please wait';render();
  try{
    const sheets=[];
    for(const f of files){
      const durl=await fileToDataURL(f);const b64=durl.split(',')[1];const parts=[];let thumb='';
      if(f.type==='application/pdf'){parts.push({inline_data:{mime_type:'application/pdf',data:b64}})}
      else{const view=await compressImage(durl,720,.62);thumb=view||durl;const small=await compressImage(durl,1600,.85);parts.push({inline_data:{mime_type:'image/jpeg',data:(small||durl).split(',')[1]}})}
      const j=await geminiRead(parts);
      const d=sheetFromAI(j,thumb);d.imgs=thumb?[thumb]:[];sheets.push(d);
    }
    upBusy='';upErr='';lastAIErr='';
    if(sheets.length===1)startSheet(null,sheets[0],true);else startMultiSheets(sheets);
  }catch(e){let msg=String((e&&e.message)||e).slice(0,240);if(/503|high demand|overload|unavailable|temporarily/i.test(msg))msg="Google's AI model is busy right now (temporary) — please try again in a moment.";upBusy='';upErr='AI could not read the sheet: '+msg;lastAIErr=msg;render();startSheet(null,blankSheet(),true)}
}

function saveDraft(){
  const it=draft.data;
  if(!it.plant){toast('Select a plant');return}
  let saved,emps=[];
  if(draft.kind==='bill'){
    if(!it.per){toast('Select a billing period');return}
    if(draft.id){saved=S.bills.find(x=>x.id===draft.id);Object.assign(saved,it)}
    else{saved=Object.assign({},it,{id:uid()});S.bills.push(saved)}
    pushRows([{type:'bill',data:stripImgs(saved)}]);
  }else if(draft.kind==='man'){
    const r=Object.assign({id:uid()},it);S.man=S.man||[];S.man.push(r);pushRows([{type:'manpower',data:stripImgs(r)}]);save();closeModal();render();toast('Manpower record saved');return;
  }else{
    if(!/^\d{4}-\d\d-\d\d$/.test(it.date||'')){toast('Enter a valid date');return}
    if(it.decl==null||it.decl===''){toast('Declared total is required before you can validate');return}
    if(it.agency&&S.settings.agencies.indexOf(it.agency)<0)S.settings.agencies.push(it.agency);
    if(draft.id){saved=S.sheets.find(x=>x.id===draft.id);Object.assign(saved,it)}
    else{saved=Object.assign({},it,{id:uid()});S.sheets.push(saved)}
    emps=upsertEmployees(it.ros,it.date,it.agency);
    gridWeek=sun(it.date);
    pushRows([{type:'sheet',data:stripImgs(saved)}].concat(sheetRows('employee',emps)));
  }
  save();closeModal();render();toast('Saved');
}

/* ============================================================
   EXPORTS
   ============================================================ */
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportCSV(kind){
  let rows,head;
  if(kind==='b'){head=['Plant','Category','Vendor','Invoice','Period','Amount'];rows=fBills().map(b=>[b.plant,b.cat,b.vendor,b.inv,b.per,b.amt])}
  else{head=['Date','Plant','Shift','Agency','Required','Actual',].concat(S.settings.positions.map(p=>p+' req'),S.settings.positions.map(p=>p+' actual'),['Fill %','Signed']);rows=fSheets().map(s=>{const v=validate(s);return [s.date,s.plant,s.shift,s.agency,v.rq,v.ac].concat(S.settings.positions.map(p=>(s.rows[p]||[0,0])[0]),S.settings.positions.map(p=>(s.rows[p]||[0,0])[1]),[v.rq?pct(v.ac,v.rq).toFixed(1):'',v.st==='ok'?'Yes':'No'])})}
  const csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('pcmd-'+(kind==='b'?'billing':'attendance')+'-'+today()+'.csv',csv,'text/csv');
}
function exportJSON(){download('pcmd-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json')}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!j.settings)throw 0;S=j;save();render();toast('Backup imported')}catch(e){toast('Invalid backup file')}};r.readAsText(file)}

/* ============================================================
   EVENTS
   ============================================================ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2200)}
function openReport(pl,d,sh){rp={plant:pl,date:d,shift:sh};renderModal()}

function act(a,ds){
  switch(a){
    case 'nav-open':$('#app').classList.add('nav-open');break;
    case 'nav-close':$('#app').classList.remove('nav-open');break;
    case 'theme':toggleTheme();break;
    case 'go':nav=ds.v;render();break;
    case 'settings':nav='settings';render();break;
    case 'sub':sub=ds.v;lim=60;render();break;
    case 'quick-new':(sub==='bill'?startBill():startSheet());break;
    case 'bill-new':startBill();break;
    case 'bill-edit':startBill(ds.id);break;
    case 'sheet-new':startSheet();break;
    case 'sheet-edit':startSheet(ds.id);break;
    case 'open-sheet':startSheet(ds.id);break;
    case 'week-add':startSheet(null,Object.assign(blankSheet(),{plant:ds.plant,date:ds.date,shift:ds.shift}));break;
    case 'grid-week':gridWeek=addDay(gridWeek,7*(+ds.n));render();break;
    case 'del-sheet':{const dd=(draft&&draft.data)||{};const rec=(S.sheets||[]).find(x=>x.id===(draft&&draft.id))||(S.sheets||[]).find(x=>x.plant===dd.plant&&x.date===dd.date&&x.shift===dd.shift&&x.agency===dd.agency);if(!rec){toast('Sheet not found — nothing deleted');break}if(confirm('Delete this attendance sheet? It will also be removed from Google Sheet.')){deleteRecord('sheet',rec.id);closeModal();render();toast('Sheet deleted')}break;}
    case 'del-bill':{const id=ds.id||(draft&&draft.id);if(id&&confirm('Delete this bill? It will also be removed from Google Sheet.')){deleteRecord('bill',id);closeModal();render();toast('Bill deleted')}break;}
    case 'ind-person':pcal={name:ds.name};renderModal();break;
    case 'cal-open':pday={name:ds.name,date:ds.date};renderModal();break;
    case 'pcal-back':pday=null;renderModal();break;
    case 'pimg':pimg=ds.src;renderModal();break;
    case 'pimg-close':pimg=null;renderModal();break;
    case 'bview':bview={id:ds.id,idx:0};renderModal();break;
    case 'bview-tab':if(bview)bview.idx=+ds.i;renderModal();break;
    case 'bview-edit':closeModal();startBill(ds.id);break;
    case 'del':deleteRecord(ds.kind==='sheet'?'sheet':'bill',ds.id);render();toast('Deleted');break;
    case 'row':open[ds.id]=!open[ds.id];render();break;
    case 'more':lim+=60;render();break;
    case 'close':closeModal();break;
    case 'close-bg':if(ds)closeModal();break;
    case 'save':saveDraft();break;
    case 'img-tab':draft.imgIdx=+ds.i;renderModal();break;
    case 'ros-add':draft.data.ros=draft.data.ros||[];draft.data.ros.push({n:'',p:ds.pos||S.settings.positions[0],a:1,ti:'',to:''});draft.dirty=true;renderModal();break;
    case 'ros-del':draft.data.ros.splice(+ds.i,1);syncActual();draft.dirty=true;renderModal();break;
    case 'req-reset':S.settings.positions.forEach(p=>{draft.data.rows[p]=[S.settings.req[p]||0,(draft.data.rows[p]||[0,0])[1]]});draft.dirty=true;renderModal();break;
    case 'emp-add':if(!S.employees)S.employees=[];S.employees.push({id:uid(),name:'New employee',position:S.settings.positions[0],agency:S.settings.agencies[0],status:'active',from:today(),to:'',note:''});save();render();break;
    case 'emp-del':deleteRecord('employee',ds.id);render();break;
    case 'print':window.print();break;
    case 'print-save':toast('Choose “Save as PDF” in the print dialog');setTimeout(()=>window.print(),300);break;
    case 'csv':exportCSV(ds.v);break;
    case 'json':exportJSON();break;
    case 'ai-test':testAI();break;
    case 'sheet-test':sheetTest();break;
    case 'sheet-push-all':sheetPushAll();break;
    case 'sheet-pull':sheetPull();break;
    case 'save-settings':save();render();toast('Settings saved');break;
    case 'cost-memo':costMemo=!costMemo;render();break;
    case 'man-del':{const i=+ds.i,rc=(S.man||[])[i];if(rc&&confirm('Delete this manpower record? It will also be removed from Google Sheet.')){if(rc.id)deleteRecord('manpower',rc.id);else{S.man.splice(i,1);save()}render();toast('Deleted — '+(S.man||[]).length+' left')}break;}
    case 'multi-tab':multiIdx=+ds.i;renderMultiModal();break;
    case 'multi-save':{if(!multiSheets||!multiSheets.length)break;const emps=[],rows=[];multiSheets.forEach(d=>{const rec=Object.assign({},d,{id:uid()});S.sheets.push(rec);rows.push({type:'sheet',data:stripImgs(rec)});emps.push.apply(emps,upsertEmployees(d.ros,d.date,d.agency));gridWeek=sun(d.date)});rows.push.apply(rows,sheetRows('employee',emps));pushRows(rows);const n=multiSheets.length;multiSheets=null;save();closeModal();render();toast('Saved '+n+' sheets');break;}
    case 'cost-add':costFormOpen=!costFormOpen;render();break;
    case 'cost-save':{const g=id=>document.getElementById(id);const plant=(g('nc_plant')||{}).value||'';const period=(g('nc_period')||{}).value||'';if(!plant||!period||!+(g('nc_vol')||{}).value){toast('Plant, period and volume are required');break;}const r={id:uid(),plant:plant,period:period};COST_KEYS.forEach(k=>r[k]=+((g('nc_'+k)||{}).value)||0);r.nat=/^NATIONAL/.test(plant)?1:0;r.total=COST_ADD.reduce((s,k)=>s+r[k],0);S.costs.push(r);pushRows([{type:'cost',data:stripImgs(r)}]);save();costFormOpen=false;render();toast('Cost record saved');break;}
    case 'cost-del':{const rc=S.costs[+ds.i];if(rc&&confirm('Delete this cost row? It will also be removed from Google Sheet.')){deleteRecord('cost',rc.id);render();toast('Deleted')}break;}
    case 'copy-diag':try{navigator.clipboard.writeText(diagText());toast('Diagnostics copied — paste to support')}catch(e){toast('Copy failed — select the text above manually')}break;
    case 'clear':if(confirm('Delete ALL recorded data from this browser? Export a backup first.')){S.bills=[];S.sheets=[];save();render();toast('All data cleared')}break;
    case 'rp-step':step(+ds.n);break;
    case 'rp-open':rp.plant=ds.plant;render();break;
    case 'eg-nav':egNav(+ds.n);break;
    case 'open-report':openReport(ds.plant,ds.date,ds.shift);break;
    case 'print-format':printFormat();break;
  }
}
function step(n){const i=S.settings.shifts.indexOf(rp.shift)+n;if(i<0){rp.shift=S.settings.shifts.at(-1);rp.date=addDay(rp.date,-1)}else if(i>=S.settings.shifts.length){rp.shift=S.settings.shifts[0];rp.date=addDay(rp.date,1)}else rp.shift=S.settings.shifts[i];renderModal()}
function egNav(n){if(eg.view==='monthly')eg.ym=new Date(Date.UTC(+eg.ym.slice(0,4),+eg.ym.slice(5,7)-1+n,1)).toISOString().slice(0,7);else eg.wk=addDay(eg.wk,7*n);render()}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',cur);localStorage.setItem('pcmd.theme',cur);paintTheme()}
function paintTheme(){const dark=document.documentElement.getAttribute('data-theme')==='dark';$('#themeBtn').innerHTML=icon(dark?'sun':'moon',18)}
function closeNav(){$('#app').classList.remove('nav-open')}
function printFormat(){
  const summary='<div class="paper" style="page-break-after:always"><div class="hd"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center"><b>MANNING SUMMARY REPORT</b><span style="opacity:.9;font-size:11.5px">PRIJ MANPOWER SERVICES · TAYUD CONSOLACION, CEBU · PRODUCTION AREA</span></div></div><div class="infogrid"><div><span class="mu">Plant / Site</span><br>______________</div><div><span class="mu">Date</span><br>__ / __ / ____</div><div><span class="mu">Shift</span><br>☐ First ☐ Second</div><div><span class="mu">Time</span><br>__________</div><div><span class="mu">Agency</span><br>PRIJ Manpower Services</div></div><table class="t"><thead><tr><th>Position</th><th class="r">Required</th><th class="r">Actual</th><th>Verified by</th></tr></thead><tbody>'+S.settings.positions.map(p=>'<tr><td>'+esc(p)+'</td><td class="r">▢</td><td class="r">▢</td><td>______</td></tr>').join('')+'<tr class="tot"><td>GRAND TOTAL MANNING</td><td class="r">▢</td><td class="r">▢</td><td></td></tr></tbody></table><div class="sig">'+[['Prepared by','PRIJ Coordinator'],['Checked by','PRIJ Admin Staff'],['Attested by','Vienovo Warehouse Coordinator'],['Concurred by','Vienovo Warehouse Team Leader']].map(([a,b])=>'<div><b>'+a+'</b><div class="mu">'+b+'</div></div>').join('')+'</div></div>';
  const roster='<div class="paper"><div class="hd"><b>PRIJ ACTUAL MANNING (ROSTER)</b></div><div class="infogrid"><div><span class="mu">Plant / Site</span><br>______________</div><div><span class="mu">Date</span><br>__ / __ / ____</div><div><span class="mu">Shift</span><br>☐ First ☐ Second</div><div><span class="mu">Agency</span><br>PRIJ Manpower Services</div></div><div class="grid g2" style="margin:0">'+S.settings.positions.map(p=>'<div style="border:1px solid var(--line);border-radius:8px;padding:8px 10px"><b style="font-size:12px">'+esc(p)+'</b><div style="border-bottom:1px solid var(--line);height:20px"></div><div style="border-bottom:1px solid var(--line);height:20px"></div><div style="border-bottom:1px solid var(--line);height:20px"></div></div>').join('')+'</div><div class="sig">'+[['Prepared by','PRIJ Personnel'],['Attested by','Vienovo Coordinator']].map(([a,b])=>'<div><b>'+a+'</b><div class="mu">'+b+'</div></div>').join('')+'</div></div>';
  const host=document.createElement('div');host.id='rpt';host.className='wrap';host.innerHTML=summary+roster;
  document.body.appendChild(host);
  try{window.print()}finally{setTimeout(()=>{if(host.parentNode)host.parentNode.removeChild(host)},1200)}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='close-bg'&&e.target!==t)return;   /* only close when clicking the dim backdrop, not inside the modal */
  e.preventDefault();act(t.dataset.act,t.dataset);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-filter]')){filters[el.dataset.filter]=el.value;render();return}
  if(el.matches('[data-eg]')){eg[el.dataset.eg]=el.value;if(el.dataset.eg==='view'){eg.ym=monthsList().at(-1)||curMonth();eg.wk=sun(today())}render();return}
  if(el.matches('[data-rp]')){if(rp){rp[el.dataset.rp]=el.value;renderModal()}return}
  if(el.matches('[data-setting]')){S.settings[el.dataset.setting]=el.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);save();render();return}
  if(el.matches('[data-req]')){S.settings.req[el.dataset.req]=+el.value||0;save();return}
  if(el.matches('[data-import]')){if(el.files[0])importJSON(el.files[0]);return}
  if(el.matches('[data-attfile]')){const all=[...(el.files||[])];el.value='';if(el.hasAttribute('data-add')){const fs=all.filter(f=>f.type.indexOf('image/')===0).slice(0,5);if(fs.length&&draft&&draft.kind==='sheet'){(async()=>{draft.data.imgs=draft.data.imgs||[];for(const f of fs){if(draft.data.imgs.length>=5)break;const v=await compressImage(await fileToDataURL(f),720,.62);if(v)draft.data.imgs.push(v)}draft.data.thumb=draft.data.imgs[0]||draft.data.thumb||'';draft.dirty=true;renderModal()})()}return}if(all.length)handleAttUpload(all);return}
  if(el.matches('[data-billfile]')){const all=[...(el.files||[])];el.value='';if(all.length)handleBillUpload(all);return}
  if(el.matches('[data-ind]')){const y=window.scrollY;indPlant=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-indmm]')){const y=window.scrollY;indMonth=indMonth.slice(0,4)+'-'+el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-indyy]')){const y=window.scrollY;indMonth=el.value+'-'+indMonth.slice(5,7);render();window.scrollTo(0,y);return}
  if(el.matches('[data-inda]')){const y=window.scrollY;indAgency=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-bplant]')){const y=window.scrollY;bPlant=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-bmonth]')){const y=window.scrollY;bMonth=bMonth.slice(0,4)+'-'+el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-byear]')){const y=window.scrollY;bMonth=el.value+'-'+bMonth.slice(5,7);render();window.scrollTo(0,y);return}
  if(el.matches('[data-ctrend]')){const y=window.scrollY;costTrend=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-cmode]')){const y=window.scrollY;costMode=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-cmonth]')){const y=window.scrollY;costTMonth=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-manfile]')){const all=[...(el.files||[])];el.value='';if(all.length)handleManUpload(all);return}
  if(el.matches('[data-wk]')){const y=window.scrollY;gridWeek=el.value;render();window.scrollTo(0,y);return}
  if(el.matches('[data-ai]')){S.settings.ai=S.settings.ai||{key:'',model:'gemini-2.0-flash'};S.settings.ai[el.dataset.ai]=el.value;save();toast('Saved');return}
  if(el.matches('[data-sheet]')){S.settings.sheet=S.settings.sheet||{url:'',token:''};S.settings.sheet[el.dataset.sheet]=el.value;save();toast('Saved');return}
  if(el.matches('[data-emp]')){const e=(S.employees||[]).find(x=>x.id===el.dataset.id);if(e){e[el.dataset.emp]=el.value;save()}return}
  if(el.matches('[data-k]')&&draft){setPath(el.dataset.k,readVal(el));if(el.dataset.k.indexOf('ros.')===0)syncActual();draft.dirty=true;setTimeout(renderModal,0);return}
});

/* ============================================================
   RENDER
   ============================================================ */
const TABS=[['dash','Dashboard','grid'],['upload','Upload','upload']];
const META={
  dash:{t:'Dashboard',s:{bill:'Production cost dashboard',att:'Manpower monitoring'}},
  upload:{t:'Upload',s:{bill:'Add a billing entry',att:'Add an attendance sheet'}},
  records:{t:'Records',s:{bill:'All billing entries',att:'All attendance sheets'}},
  settings:{t:'Settings',s:{bill:'Masters, defaults and data management',att:'Masters, defaults and data management'}}
};
function currentView(){
  if(nav==='settings')return pageSettings();
  if(nav==='dash')return sub==='bill'?pageCost():pageManpower();
  if(nav==='upload')return sub==='bill'?entryBill():entryAtt();
  return sub==='bill'?pageCost():pageAttendance();
}
function subTabs(){
  const labels=(nav==='dash')?[['bill','Cost'],['att','Manpower']]:[['bill','Cost'],['att','Attendance']];
  return '<div class="subtabs">'+labels.map(([k,t])=>'<button data-act="sub" data-v="'+k+'" class="'+(sub===k?'on':'')+'">'+t+'</button>').join('')+'</div>';
}
function renderTopNav(){
  const el=$('#topnav');if(!el)return;
  el.innerHTML=TABS.map(([v,t,i])=>'<button data-act="go" data-v="'+v+'" class="'+(v===nav?'on':'')+'">'+icon(i,17)+'<span>'+t+'</span></button>').join('');
}
function render(){
  renderTopNav();
  const m=META[nav]||META.dash;
  const head='<div class="pagehead" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h1>'+esc(m.t)+'</h1><p>'+esc(m.s[sub]||m.s.bill||'')+'</p></div><span class="mu" style="font-size:11px;white-space:nowrap">'+esc(BUILD)+'</span></div>';
  $('#view').innerHTML=head+(nav==='settings'?'':subTabs())+currentView();
  window.scrollTo({top:0,behavior:'instant'});
}
function defaultSettings(){return{plants:DEFAULT_PLANTS.slice(),attPlants:DEFAULT_ATT_PLANTS.slice(),shifts:DEFAULT_SHIFTS.slice(),cats:DEFAULT_CATS.slice(),positions:DEFAULT_POSITIONS.slice(),req:Object.assign({},DEFAULT_REQ),agencies:DEFAULT_AGENCIES.slice(),ai:{key:'',model:'gemini-2.0-flash'},sheet:{url:'',token:''}}}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  const savedTheme=localStorage.getItem('pcmd.theme');
  if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
  paintTheme();
  S=load();
  if(S&&S.sample){S.bills=[];S.sheets=[];S.employees=[];delete S.sample;save()}
  if(!S||!S.settings){S={settings:defaultSettings(),bills:[],sheets:[],employees:[],deleted:[]};save()}
  if(!S.deleted)S.deleted=[];
  if(!S.costs)S.costs=costSeed();
  if(!S.man)S.man=[];
  if(!S.settings.positions)S.settings=defaultSettings();
  if(!S.settings.ai)S.settings.ai={key:'',model:'gemini-2.0-flash'};
  if(!S.settings.sheet)S.settings.sheet={url:'',token:''};
  if(!S.employees)S.employees=[];
  prunePhotos();
  const _ds=(S.sheets||[]).map(s=>s.date).filter(Boolean).sort();if(_ds.length)gridWeek=sun(_ds[_ds.length-1]);
  const lg=$('#logo');if(lg&&LOGO)lg.src=LOGO;
  render();
  sheetAutoSync();if(typeof setInterval==='function')setInterval(sheetAutoSync,60000);
}
init();
